# One container plus a small Postgres on Render: the owner's private app (docs/PREVIEW.md).
# Paid plans by default (about $13 a month in 2026; check render.com/pricing): Render's free database
# is deleted 30 days after it is created, which takes the app's data with it. For a throwaway trial
# only, both plans may be set to "free".
services:
  - type: web
    name: {{slug}}-preview
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    # Ordinary merges don't deploy: a release does, through .github/workflows/deploy.yml and the
    # service's deploy hook. Manual Deploy in Render re-deploys by hand.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: {{slug}}-preview-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      # Who can get in, from the App profile's access model: invite, open or none. new-app sets it;
      # until then the server refuses to start.
      - key: SIGN_IN_MODE
        value: "choose: invite, open or none"
      # Prints the first invite link in the log (invite mode only).
      - key: BOOTSTRAP_INVITE
        value: "1"

databases:
  - name: {{slug}}-preview-db
    plan: basic-256mb
