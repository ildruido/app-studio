name: Mirror

# Copies the app files (not the project files) to the public repo on every release: one commit plus the
# release tag, no older history. scripts/mirror/public-tree.ts decides which files go.
# Starts when the "Release tag" workflow finishes (a tag made by a workflow starts no other workflow),
# when a v* tag is pushed by hand, or by hand with a tag. Needs the repository secret PUBLIC_MIRROR_TOKEN
# (a fine-grained token with Contents: Read and write on the public repo only) and, unless the public
# repo is <owner>/{{slug}}-app, the repository variable PUBLIC_REPO. Setup: .claude/packs/mirror/RELEASE.md.

on:
  workflow_run:
    workflows: ["Release tag"]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.4.0"
        required: true

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLIC_REPO: ${{ vars.PUBLIC_REPO || format('{0}/{1}-app', github.repository_owner, '{{slug}}') }}

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}

      - name: Which release
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push) tag="$REF_NAME" ;;
            *)
              tag="v$(node -p "require('./package.json').version")"
              # Release tag also runs for package.json changes that are not releases: mirror only a tagged commit.
              if ! git fetch -q --depth=1 origin "+refs/tags/$tag:refs/tags/$tag" 2> /dev/null \
                || [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "No release tag on this commit; nothing to mirror."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check the token
        if: steps.tag.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PUBLIC_MIRROR_TOKEN is not set; see .claude/packs/mirror/RELEASE.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the public tree
        if: steps.tag.outputs.skip != 'true'
        run: |
          npm ci --no-audit --no-fund
          npx tsx scripts/mirror/public-tree.ts "$RUNNER_TEMP/public-tree"

      - name: Push to the public repo
        if: steps.tag.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" "$RUNNER_TEMP/public"
          cd "$RUNNER_TEMP/public"
          git checkout -q -B main
          git rm -rq --ignore-unmatch .
          cp -a "$RUNNER_TEMP/public-tree/." .
          git add -A
          git config user.name "{{slug}}-mirror"
          git config user.email "mirror@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing changed since the last mirror."
          else
            git commit -qm "Release ${TAG}"
          fi
          # Re-running a release's mirror moves that tag in the public copy only; the private tag never moves.
          git tag -f "$TAG"
          git push -q origin main
          git push -qf origin "$TAG"
          echo "Mirrored ${TAG} to ${PUBLIC_REPO}."
