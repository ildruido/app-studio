name: Packs smoke

# Builds a scratch app from the stack packs (about 2 minutes). Runs only when a pack or the sync tool changes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["packs/**", "scripts/studio-sync.mjs", "scripts/packs-smoke.mjs"]
  workflow_dispatch:

concurrency:
  group: packs-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/packs-smoke.mjs web artifact
      - run: node scripts/packs-smoke.mjs web
      - run: node scripts/packs-smoke.mjs artifact
