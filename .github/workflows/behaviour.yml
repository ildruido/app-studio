name: Behaviour check

# The few harness behaviours only the model can show (scripts/behaviour-check.mjs, issue #216): headless Claude Code
# on a throwaway app, fixed prompts, code assertions. Runs on main only (a release lands there through a merged PR)
# and by hand (Actions > Behaviour check > Run workflow), never on PR code, so the API key never meets PR code.
# Without the ANTHROPIC_API_KEY repo secret it skips with a notice and passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

concurrency:
  group: behaviour
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.323
      - name: Behaviour checks
        run: |
          node scripts/behaviour-check.mjs | tee out.txt
          status=${PIPESTATUS[0]}
          if grep -q "skipped" out.txt; then echo "::notice title=Behaviour check skipped::Add the ANTHROPIC_API_KEY repository secret to turn it on."; fi
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
