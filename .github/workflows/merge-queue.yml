name: Merge queue

# One app-facing PR at a time (GOVERNANCE sections 5 and 9; scripts/merge-queue.mjs). Posts QUEUE-WAIT / QUEUE-TURN comments on queued
# PRs and switches on auto-merge for the PR whose turn it is. Runs from the base branch and never checks out or runs a PR's code:
# the script reads the PR list, file names and comments through the API (data only). A comment or auto-merge made with the workflow
# token starts no CI run, so the build thread updates its own branch after its turn comment; a CI run ending (workflow_run) is the safety net for
# events that were missed; the cron is only a bonus (it has never fired). The same run also relays live-check results from studio-scratch onto their PRs.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, labeled]
  push:
    branches: [main]
  # CI finishing is the reliable safety net: a PR's own checks always end in one, so a missed event is caught at the next CI run.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The half-hourly cron has never fired since this workflow was created (GitHub runs a schedule only from the default branch and
  # may delay or skip it), so nothing depends on it; it stays as a bonus.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/merge-queue.mjs run
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Live-check results: read studio-scratch #71/#72 (read-only token) and comment each new result on its PR, so the build
      # thread never carries one between repos (scripts/live-check-relay.mjs). Trusted script from main; PR code is never run.
      - if: ${{ !cancelled() }}
        run: node scripts/live-check-relay.mjs run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
