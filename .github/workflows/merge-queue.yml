name: Merge queue

# One app-facing PR at a time (GOVERNANCE sections 5 and 9; scripts/merge-queue.mjs). Posts QUEUE-WAIT / QUEUE-TURN comments on queued
# PRs and switches on auto-merge for the PR whose turn it is. Runs from the base branch and never checks out or runs a PR's code:
# the script reads the PR list, file names and comments through the API (data only). A comment or auto-merge made with the workflow
# token starts no CI run, so the build thread updates its own branch after its turn comment. The same run also relays live-check results
# from studio-scratch onto their PRs (the build thread reads them itself too).
on:
  # Each run is billed as at least one minute (issue #339), so it starts only when the queue can change without a CI run: a PR is
  # opened, reopened or turned back to a draft (CI skips drafts, so an app-facing draft needs its QUEUE-TURN from here), and `main`
  # moves (a merge hands the turn to the next PR). For a ready PR the CI job's `queue` step runs this same script on every event.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/merge-queue.mjs run
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Live-check results: read studio-scratch #71/#72 (read-only token) and comment each new result on its PR, so the build
      # thread never carries one between repos (scripts/live-check-relay.mjs). Trusted script from main; PR code is never run.
      - if: ${{ !cancelled() }}
        run: node scripts/live-check-relay.mjs run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
