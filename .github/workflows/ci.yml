name: CI

# The one required check, `check`. It always runs on a ready PR: tests, core lint, the release check
# (version and changelog), the packs smoke test (about 2 minutes) when packs or the sync tool change,
# the branch live-check gate for app-facing PRs (scripts/branch-gate.mjs), and the risk tier (scripts/tier.mjs). A PR in the owner tier fails `check` until it carries the label
# `owner-ok`, which a thread adds only after the App-Studio Owner's OK. Adding the label records a
# fingerprint of the PR's own changes in a comment; the OK stays valid while that fingerprint is
# unchanged (so updating the branch because `main` moved keeps it) and is removed when the changes differ.
#
# Two jobs per run (issue #339: GitHub bills every job as at least 1 minute, and five jobs per run ran the Actions minutes out):
#   - `tests`: read-only token, no secret, credentials dropped. Steps `tier` (trusted scripts from the base branch over the PR's files,
#     data only) and `tests` (the only step that runs PR code).
#   - `check`: the write token and the secret LIVE_CHECK_TOKEN. Steps `gate`, `queue` and `verdict`; it runs only scripts from the base
#     branch and never runs PR code (the PR checkout is data for the gate). It needs `tests`, so PR code has finished before it starts.
# finish.mjs reads each step's conclusion by its name: tier, tests (job tests), gate, queue (job check).
# A PR must not be able to edit the rules that judge it, so this workflow runs from the base branch
# (`pull_request_target`): the PR's own copy of this file is never used. Rules for editing it:
#   - A job that has a write permission or a secret never runs PR code.
#   - `check` is a job of this run, not a check posted through the API: GitHub files an API-posted check
#     in the first check suite of the commit, which may be a cancelled or failed one, and then keeps
#     saying `check` is expected (seen on PRs #60 and #62).
# Fork PRs: every step runs only for PRs from this repository (head.repo.full_name == github.repository), so a fork's
# code never runs under pull_request_target; the job still runs for a fork PR (it checks out nothing) and its last step fails: a skipped required check would count as passed.
# scripts/ci-guard.test.mjs fails when one of these rules is broken.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# A PR that changes only docs (not docs/audits), release records or the changelog skips the unit tests (core lint, coherence lint, release data stay).
jobs:
  tests:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      fp: ${{ steps.tier.outputs.fp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tier: fp = fingerprint of the PR's own changes (scripts/own-fp.mjs: no generated files, zero context lines), unchanged when
      # `main` is merged into the branch. code = false when only docs, release records or the changelog changed.
      - name: tier
        id: tier
        working-directory: pr
        run: |
          set -e
          node ../trusted/scripts/release-check.mjs --base "origin/$BASE"
          echo "fp=$(node ../trusted/scripts/own-fp.mjs --base "origin/$BASE")" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "origin/$BASE...HEAD")
          if echo "$files" | grep -qvE '^(docs/|releases/|CHANGELOG\.md$|README\.md$)' || echo "$files" | grep -q '^docs/audits/'; then echo code=true >> "$GITHUB_OUTPUT"; else echo code=false >> "$GITHUB_OUTPUT"; fi
          node ../trusted/scripts/tier.mjs --base "origin/$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ALL_NEED_OWNER: ${{ vars.ALL_NEED_OWNER }}
      # tests: PR code runs here and only here. Each check goes through ci-run: when it fails, the last lines of the step are the
      # failing check's summary (what failed, file:line, message), also as error annotations and on the run's summary page.
      - name: tests
        id: tests
        working-directory: pr
        run: |
          set -e
          if [ "$CODE" = true ]; then
            node scripts/ci-run.mjs "Tests (every scripts/*.test.mjs)" -- node scripts/ci-tests.mjs
          fi
          node scripts/ci-run.mjs "Core lint" -- node scripts/core-lint.mjs
          node scripts/ci-run.mjs "Coherence lint" -- node scripts/coherence-lint.mjs
          node scripts/ci-run.mjs "Release data" -- node scripts/release.mjs validate
          if [ "$PACKS" = true ]; then
            node scripts/packs-smoke.mjs web artifact
            node scripts/packs-smoke.mjs web
            node scripts/packs-smoke.mjs web mirror
            node scripts/packs-smoke.mjs web artifact ai ai-web
            node scripts/packs-smoke.mjs web ai-web
            node scripts/packs-smoke.mjs artifact
            node scripts/packs-smoke.mjs artifact ai
            node scripts/packs-smoke.mjs static-site
            node scripts/packs-smoke.mjs web artifact user
          fi
        env:
          CODE: ${{ steps.tier.outputs.code }}
          PACKS: ${{ steps.tier.outputs.packs }}

  # The one result the ruleset requires, posted on the PR's head commit. Passes when tier and tests passed and, for the owner tier, the
  # PR carries `owner-ok` for the PR's current changes. Adding the label records their fingerprint in a comment; a later run keeps the
  # OK while the fingerprint matches and removes the label when it does not (only a run for the PR's current head commit may remove it).
  # Runs no PR code; for a fork PR `tests` is skipped and the verdict fails.
  check:
    needs: [tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      SAME: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - if: env.SAME == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false
      - if: env.SAME == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - if: env.SAME == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # gate: the branch live-check gate: an app-facing PR needs a passing studio-scratch result for its current app-facing
      # changes (scripts/branch-gate.mjs). Reads studio-scratch PR #72 with a read-only token (secret LIVE_CHECK_TOKEN).
      - name: gate
        id: gate
        if: env.SAME == 'true'
        working-directory: pr
        run: node ../trusted/scripts/branch-gate.mjs check --base "origin/$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
      # queue: the merge queue (scripts/merge-queue.mjs): posts the QUEUE-WAIT / QUEUE-TURN comments and fails an app-facing PR
      # that is not first in line. The merge-queue workflow also runs it for a new PR (drafts get no CI) and when `main` moves.
      - name: queue
        id: queue
        if: ${{ !cancelled() && env.SAME == 'true' }}
        working-directory: trusted
        run: |
          node scripts/merge-queue.mjs run || echo "merge queue run failed (not fatal)"
          node scripts/merge-queue.mjs turn --pr "$PR"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - name: verdict
        if: ${{ !cancelled() }}
        env:
          TIER_RESULT: ${{ needs.tests.result }}
          TESTS_RESULT: ${{ needs.tests.result }}  # the tests job: its tier and tests steps
          GATE_RESULT: ${{ steps.gate.outcome }}
          QUEUE_RESULT: ${{ steps.queue.outcome }}
          TIER: ${{ needs.tests.outputs.tier }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FP: ${{ needs.tests.outputs.fp }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_OK: ${{ contains(github.event.pull_request.labels.*.name, 'owner-ok') }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          FP="${FP:-none}"
          note=""
          if [ "$TIER" = owner ] && [ "$HAS_OK" = true ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha 2>/dev/null || echo "")
            saved=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' 2>/dev/null \
              | grep -o 'owner-ok-fingerprint: [A-Za-z0-9]*' | tail -1 | cut -d' ' -f2 || true)
            if [ "$ACTION" = labeled ] && [ "$LABEL" = owner-ok ]; then
              # A fresh OK: remember which changes it covers (only from a run for the current head commit).
              if [ "$current" = "$HEAD_SHA" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                  -f body="<!-- owner-ok-fingerprint: $FP -->
          Owner OK recorded for this PR's own changes. It stays valid while those changes stay the same (updating the branch because main moved keeps it); any change to them removes it." >/dev/null || true
                saved="$FP"
              fi
            fi
            if [ "$saved" != "$FP" ]; then
              if [ "$current" = "$HEAD_SHA" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/owner-ok" >/dev/null 2>&1 || true
              fi
              HAS_OK=false
              note=" The PR's own changes differ from the ones the owner OK'd, so the OK was removed."
            fi
          fi
          result=success
          msg="Tier: ${TIER:-none}. Tier and tests: $TESTS_RESULT, branch live check: $GATE_RESULT."
          if [ "$FORK" = true ]; then
            result=failure; msg="This PR comes from a fork: no check runs for it. Re-push it as a branch of this repository."
          elif [ "$QUEUE_RESULT" != success ]; then
            result=failure; msg="This app-facing PR is waiting in the merge queue (see the queue step's output for who is ahead). Wait for its QUEUE-TURN comment, then update the branch from main. $msg"
          elif [ "$GATE_RESULT" != success ]; then
            result=failure; msg="This PR changes app-facing files and has no passing branch live check for them (see the gate step's output for what to run). $msg"
          elif [ "$TIER_RESULT" != success ] || [ "$TESTS_RESULT" != success ]; then
            result=failure; msg="The checks did not pass. $msg The failing check's summary (what failed, file:line, message) is the last lines of the failing step in the tests job, and on this run's summary page."
          elif [ -z "$TIER" ]; then
            result=failure; msg="No tier was set."
          elif [ "$TIER" = owner ] && [ "$HAS_OK" != true ]; then
            result=failure; msg="This PR is in the owner tier: it needs the App-Studio Owner's OK, then the label owner-ok.$note"
          fi
          echo "$result: $msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = success ]
