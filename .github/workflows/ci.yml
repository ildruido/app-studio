name: CI

# The one required check, `check`. It always runs on a ready PR: tests, core lint, the release check
# (version and changelog), the packs smoke test (about 2 minutes) when packs or the sync tool change,
# and the risk tier (scripts/tier.mjs). A PR in the owner tier fails `check` until it carries the label
# `owner-ok`, which a thread adds only after the App-Studio Owner's OK. Adding the label records a
# fingerprint of the PR's own changes in a comment; the OK stays valid while that fingerprint is
# unchanged (so updating the branch because `main` moved keeps it) and is removed when the changes differ.
#
# A PR must not be able to edit the rules that judge it, so this workflow runs from the base branch
# (`pull_request_target`): the PR's own copy of this file is never used. Rules for editing it:
#   - A job that has a write permission never checks out or runs PR code.
#   - PR code runs only in `tests`, with a read-only token and no credentials.
#   - `tier` runs the scripts as they are on the base branch, over the PR's files (data only).
#   - `check` is a job of this run, not a check posted through the API: GitHub files an API-posted check
#     in the first check suite of the commit, which may be a cancelled or failed one, and then keeps
#     saying `check` is expected (seen on PRs #60 and #62).
# scripts/ci-guard.test.mjs fails when one of these rules is broken.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Trusted scripts from the base branch over the PR's files. Runs no PR code.
  tier:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      packs: ${{ steps.release.outputs.packs }}
      fp: ${{ steps.fp.outputs.fp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        working-directory: pr
        run: node ../trusted/scripts/release-check.mjs --base "origin/$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
      # Fingerprint of the PR's own changes (diff from the merge base, line numbers ignored). Merging `main`
      # into the branch does not change it. Data only: no PR code runs.
      - id: fp
        working-directory: pr
        run: echo "fp=$(git diff "origin/$BASE...HEAD" | git patch-id --stable | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
      - id: tier
        working-directory: pr
        run: node ../trusted/scripts/tier.mjs --base "origin/$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ALL_NEED_OWNER: ${{ vars.ALL_NEED_OWNER }}

  # PR code runs here and only here: read-only token, no credentials kept.
  tests:
    needs: tier
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each check goes through ci-run: when it fails, the last lines of the step are the failing check's summary
      # (what failed, file:line, message), also as error annotations and on the run's summary page.
      - run: node scripts/ci-run.mjs "Sync tests" -- node --test --test-reporter=spec scripts/studio-sync.test.mjs
      - run: node scripts/ci-run.mjs "Core lint" -- node scripts/core-lint.mjs
      - run: node scripts/ci-run.mjs "Coherence lint" -- node scripts/coherence-lint.mjs
      - run: node scripts/ci-run.mjs "Coherence lint tests" -- node --test --test-reporter=spec scripts/coherence-lint.test.mjs
      - run: node scripts/ci-run.mjs "Release check tests" -- node --test --test-reporter=spec scripts/release-check.test.mjs
      - run: node scripts/ci-run.mjs "Release script tests" -- node --test --test-reporter=spec scripts/release.test.mjs
      - run: node scripts/ci-run.mjs "Release data" -- node scripts/release.mjs validate
      - run: node scripts/ci-run.mjs "Tier tests" -- node --test --test-reporter=spec scripts/tier.test.mjs
      - run: node scripts/ci-run.mjs "CI guard tests" -- node --test --test-reporter=spec scripts/ci-guard.test.mjs
      - run: node scripts/ci-run.mjs "Failure summary tests" -- node --test --test-reporter=spec scripts/failure-summary.test.mjs
      - run: node scripts/ci-run.mjs "Backlog script tests" -- node --test --test-reporter=spec scripts/backlog.test.mjs
      - name: Packs smoke
        if: needs.tier.outputs.packs == 'true'
        run: |
          node scripts/packs-smoke.mjs web artifact
          node scripts/packs-smoke.mjs web
          node scripts/packs-smoke.mjs web mirror
          node scripts/packs-smoke.mjs web artifact ai ai-web
          node scripts/packs-smoke.mjs web ai-web
          node scripts/packs-smoke.mjs artifact
          node scripts/packs-smoke.mjs artifact ai
          node scripts/packs-smoke.mjs static-site
          node scripts/packs-smoke.mjs web artifact user

  # The one result the ruleset requires, posted on the PR's head commit. Passes when the tier and tests
  # passed and, for the owner tier, the PR carries `owner-ok` for the PR's current changes. Adding the label
  # records their fingerprint in a comment; a later run keeps the OK while the fingerprint matches and removes
  # the label when it does not (only a run for the PR's current head commit may remove it). Runs no PR code and
  # checks nothing out.
  check:
    needs: [tier, tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 2
    env:
      TIER_RESULT: ${{ needs.tier.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
      TIER: ${{ needs.tier.outputs.tier }}
      ACTION: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
      FP: ${{ needs.tier.outputs.fp }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HAS_OK: ${{ contains(github.event.pull_request.labels.*.name, 'owner-ok') }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          FP="${FP:-none}"
          note=""
          if [ "$TIER" = owner ] && [ "$HAS_OK" = true ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha 2>/dev/null || echo "")
            saved=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' 2>/dev/null \
              | grep -o 'owner-ok-fingerprint: [A-Za-z0-9]*' | tail -1 | cut -d' ' -f2 || true)
            if [ "$ACTION" = labeled ] && [ "$LABEL" = owner-ok ]; then
              # A fresh OK: remember which changes it covers (only from a run for the current head commit).
              if [ "$current" = "$HEAD_SHA" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                  -f body="<!-- owner-ok-fingerprint: $FP -->
          Owner OK recorded for this PR's own changes. It stays valid while those changes stay the same (updating the branch because main moved keeps it); any change to them removes it." >/dev/null || true
                saved="$FP"
              fi
            fi
            if [ "$saved" != "$FP" ]; then
              if [ "$current" = "$HEAD_SHA" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/owner-ok" >/dev/null 2>&1 || true
              fi
              HAS_OK=false
              note=" The PR's own changes differ from the ones the owner OK'd, so the OK was removed."
            fi
          fi
          result=success
          msg="Tier: ${TIER:-none}. Tier step: $TIER_RESULT, tests: $TESTS_RESULT."
          if [ "$TIER_RESULT" != success ] || [ "$TESTS_RESULT" != success ]; then
            result=failure; msg="The checks did not pass. $msg The failing check's summary (what failed, file:line, message) is the last lines of the failing step in the tests job, and on this run's summary page."
          elif [ -z "$TIER" ]; then
            result=failure; msg="No tier was set."
          elif [ "$TIER" = owner ] && [ "$HAS_OK" != true ]; then
            result=failure; msg="This PR is in the owner tier: it needs the App-Studio Owner's OK, then the label owner-ok.$note"
          fi
          echo "$result: $msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = success ]
